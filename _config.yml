# Site settings
title: "Borja Rodrigo Garrido - CV"
description: "Curriculum Vitae of Borja Rodrigo Garrido, Data Science student at UPV."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Borja Rodrigo Garrido"
resume_title:                   "Data Science Student at UPV"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "borja.rodrigogarrido16@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_address:         "Valencia, Spain"

resume_header_contact_info:     "Valencia, Spain • borja.rodrigogarrido16@gmail.com"
