resume_header_intro: "<p>Final-year Data Science student at UPV, passionate about data analysis, machine learning, and visualization. Seeking opportunities to apply my knowledge in real-world projects and continue developing professionally.</p>"

resume_looking_for_work:        "yes"

# Decide which sections to use
